<!DOCTYPE html>
<html>
<head>
 <meta charset="UTF-8">

    <!-- Mobile responsive support -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VoiceLink</title>

    <style>

        /* =====================================================
           VOICELINK V1 - UI STYLING
           ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* =========================
           PAGE
           ========================= */

        body {
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #0f1115;

            color: #f1f3f5;

            display: flex;
            justify-content: center;

            padding: 30px 15px;
        }


        /* =========================
           MAIN APP
           ========================= */

        .app {
            width: 100%;
            max-width: 760px;
        }


        /* =========================
           HEADER
           ========================= */

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .subtitle {
            margin-top: 7px;

            color: #8f98a5;

            font-size: 14px;
        }


        /* =========================
           CARDS
           ========================= */

        .card {
            background: #171a21;

            border: 1px solid #292e38;

            border-radius: 18px;

            padding: 20px;

            margin-bottom: 16px;

            box-shadow:
                0 12px 35px
                rgba(0, 0, 0, 0.22);
        }


        /* =========================
           SECTION TITLES
           ========================= */

        .section-title {
            color: #9ca3af;

            font-size: 12px;

            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: 1px;

            margin-bottom: 13px;
        }


        /* =========================
           INPUTS
           ========================= */

        input {
            width: 100%;

            background: #0f1115;

            color: #f1f3f5;

            border: 1px solid #343a46;

            border-radius: 10px;

            padding: 13px 14px;

            outline: none;

            font-size: 14px;
        }

        input:focus {
            border-color: #ff6b00;
        }


        /* =========================
           ROW
           ========================= */

        .row {
            display: flex;

            gap: 10px;
        }


        /* =========================
           ALL BUTTONS
           ========================= */

        button {
            border: none;

            border-radius: 10px;

            padding: 12px 18px;

            cursor: pointer;

            font-size: 14px;

            font-weight: 700;

            transition: 0.2s ease;
        }

        button:hover {
            transform: translateY(-1px);
        }


        /* =========================
           CONNECT BUTTON
           ========================= */

        #connect {
            min-width: 105px;

            background: #2741d6;

            color: white;
        }


        /* =========================
           SEND BUTTON
           ========================= */

        #send {
            width: 100%;

            margin-top: 10px;

            background: #2c333d;

            color: white;
        }


        /* =========================
           VOICE BUTTON
           ========================= */

        #voiceButton {
            width: 100%;

            min-height: 72px;

            background: #132fd1;

            color: white;

            border-radius: 14px;

            font-size: 19px;
        }

        #voiceButton:hover {
            opacity: 0.92;
        }

        #voiceButton:disabled {
            opacity: 0.55;

            cursor: not-allowed;

            transform: none;
        }


        /* =========================
           CONNECTION STATUS
           ========================= */

        .status {
            margin-top: 12px;

            color: #8f98a5;

            font-size: 13px;
        }

        .dot {
            display: inline-block;

            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #777;

            margin-right: 6px;
        }


        /* =========================
           VOICE TRANSCRIPT
           ========================= */

        #transcript {
            min-height: 22px;

            margin-top: 14px;

            color: #c7cbd1;

            font-size: 14px;

            line-height: 1.5;

            text-align: center;
        }


        /* =========================
           MESSAGE / CHAT AREA
           ========================= */

        #messages {
            min-height: 150px;

            max-height: 360px;

            overflow-y: auto;

            background: #0f1115;

            border: 1px solid #292e38;

            border-radius: 12px;

            padding: 14px;
        }

        #messages p {
            background: #20252e;

            color: #dfe3e8;

            border-radius: 10px;

            padding: 10px 12px;

            margin-bottom: 8px;

            font-size: 14px;

            line-height: 1.45;

            word-break: break-word;
        }

        #messages p:last-child {
            margin-bottom: 0;
        }


        /* =========================
           FOOTER
           ========================= */

        .footer {
            text-align: center;

            color: #626a76;

            font-size: 12px;

            margin-top: 18px;
        }


        /* =========================
           MOBILE RESPONSIVE
           ========================= */

        @media (max-width: 600px) {

            body {
                padding: 18px 10px;
            }

            .card {
                padding: 16px;

                border-radius: 14px;
            }

            .row {
                flex-direction: column;
            }

            #connect {
                width: 100%;
            }

            .logo {
                font-size: 28px;
            }
        }

    </style>
</head>

<body>

    <main class="app">


        <!-- =================================================
             HEADER
             ================================================= -->

        <header class="header">

            <div class="logo">
                VoiceLink
            </div>

            <div class="subtitle">
                Voice communication between operator and LEO
            </div>

        </header>



        <!-- =================================================
             CONNECTION CARD
             ================================================= -->

        <section class="card">

            <div class="section-title">
                Connection
            </div>


            <div class="row">

                <!-- Your client ID -->

                <input
                    id="clientId"
                    type="text"
                    placeholder="Your ID e.g. ASAD"
                >


                <!-- Existing JavaScript uses this ID -->

                <button id="connect">
                    Connect
                </button>

            </div>


            <!-- Simple visual status -->

            <div class="status">

                <span class="dot"></span>

                WebSocket Server

            </div>

        </section>



        <!-- =================================================
             TEXT COMMUNICATION CARD
             ================================================= -->

        <section class="card">

            <div class="section-title">
                Communication
            </div>


            <!-- Recipient -->

            <input
                id="recipient"
                type="text"
                placeholder="Send to e.g. LEO"
            >


            <div style="height: 10px;"></div>


            <!-- Normal text message -->

            <input
                id="message"
                type="text"
                placeholder="Type a message..."
            >


            <!-- Existing JavaScript uses this button -->

            <button id="send">
                Send Text Message
            </button>

        </section>



        <!-- =================================================
             VOICE COMMUNICATION CARD
             ================================================= -->

        <section class="card">

            <div class="section-title">
                Voice Communication
            </div>


            <!-- Existing Speech Recognition button -->

            <button id="voiceButton">
                 Speak
            </button>


            <!-- Speech Recognition transcript -->

            <p id="transcript">
                Press Speak and talk to LEO.
            </p>

        </section>



        <!-- =================================================
             CONVERSATION CARD
             ================================================= -->

        <section class="card">

            <div class="section-title">
                Conversation
            </div>


            <!-- Existing JavaScript writes messages here -->

            <div id="messages"></div>

        </section>



        <!-- =================================================
             FOOTER
             ================================================= -->

        <div class="footer">

            VoiceLink V1
            •
            FastAPI + WebSocket + Browser Speech APIs

        </div>


    </main>
<script>

    // =========================================================
    // 1. WEBSOCKET CONNECTION
    // =========================================================

    // This variable will contain our WebSocket connection.
    let socket;


    // Get HTML elements so JavaScript can interact with them.
    const clientIdInput = document.getElementById("clientId");
    const connectButton = document.getElementById("connect");

    const messageInput = document.getElementById("message");
    const sendButton = document.getElementById("send");

    const messages = document.getElementById("messages");

    const recipientInput = document.getElementById("recipient");

    const voiceButton = document.getElementById("voiceButton");
    const transcript = document.getElementById("transcript");


    // =========================================================
    // 2. CONNECT TO FASTAPI WEBSOCKET SERVER
    // =========================================================

    connectButton.onclick = () => {

        // Get the client ID entered by the user.
        const clientId = clientIdInput.value.trim();

        // Client ID is required.
        if (clientId === "") {
            alert("Enter your ID");
            return;
        }

        // Create WebSocket connection.
        //
        // Example:
        // ws://127.0.0.1:8000/ws/ASAD
        //
        // or:
        // ws://127.0.0.1:8000/ws/LEO
        socket = new WebSocket(
            "ws://127.0.0.1:8000/ws/" + clientId
        );


        // =====================================================
        // 3. CONNECTION SUCCESS
        // =====================================================

        socket.onopen = () => {

            console.log("Connected");

            messages.innerHTML +=
                "<p>Connected as: " + clientId + "</p>";
        };


        // =====================================================
        // 4. RECEIVE MESSAGE FROM SERVER
        // =====================================================

        // =========================================================
// 4. RECEIVE MESSAGE FROM SERVER
// =========================================================
//
// Server JSON bhejta hai.
//
// Example:
//
// {
//     "from": "ASAD",
//     "to": "LEO",
//     "type": "voice",
//     "data": "Hello LEO"
// }
//
// JSON sirf communication protocol hai.
// UI mein hum sirf actual message/data show karenge.
// =========================================================

socket.onmessage = (event) => {

    // Debug ke liye raw JSON console mein rahega.
    console.log("🔥 EVENT RECEIVED:", event.data);


    // JSON ko JavaScript object mein convert karo.
    const message = JSON.parse(event.data);

    console.log("🔥 PARSED MESSAGE:", message);


    // =====================================================
    // MESSAGE DATA
    // =====================================================

    const sender = message.from;
    const messageText = message.data;


    // =====================================================
    // VOICE MESSAGE
    // =====================================================

    if (message.type === "voice") {

        console.log(
            "🔥 VOICE DETECTED:",
            messageText
        );


        // -------------------------------------------------
        // Conversation mein normal message ki tarah show karo
        // -------------------------------------------------

        messages.innerHTML +=
            "<p>🎤 " +
            sender +
            ": " +
            messageText +
            "</p>";


        // -------------------------------------------------
        // Scroll conversation to bottom
        // -------------------------------------------------

        messages.scrollTop =
            messages.scrollHeight;


        // -------------------------------------------------
        // Text → Speech
        // -------------------------------------------------

        const speech =
            new SpeechSynthesisUtterance(messageText);


        speech.lang = "en-US";


        // Agar previous speech chal rahi ho
        // to usay stop karo.

        window.speechSynthesis.cancel();


        // Received voice message ko speak karo.

        window.speechSynthesis.speak(speech);

    }


    // =====================================================
    // NORMAL TEXT MESSAGE
    // =====================================================

    else if (message.type === "message") {

        // Conversation mein sirf readable message show karo.

        messages.innerHTML +=
            "<p>💬 " +
            sender +
            ": " +
            messageText +
            "</p>";


        // Automatically latest message tak scroll.

        messages.scrollTop =
            messages.scrollHeight;
    }


    // =====================================================
    // UNKNOWN MESSAGE TYPE
    // =====================================================

    else {

        console.log(
            "Unknown message type:",
            message.type
        );

    }

};


        // =====================================================
        // 6. CONNECTION CLOSED
        // =====================================================

        socket.onclose = () => {

            messages.innerHTML +=
                "<p>Disconnected</p>";
        };
    };


    // =========================================================
    // 7. NORMAL TEXT MESSAGE
    // =========================================================
    //
    // This section is ONLY for messages typed manually.
    //
    // Example:
    //
    // Type: Hello LEO
    // Click: Send
    //
    // Result:
    // type = "message"
    //

    sendButton.onclick = () => {

        // Make sure WebSocket is connected.
        if (!socket) {
            alert("Connect first");
            return;
        }


        // Get recipient ID.
        const recipient =
            recipientInput.value.trim();


        // Get typed message.
        const message =
            messageInput.value.trim();


        // Get sender ID.
        const sender =
            clientIdInput.value.trim();


        // Recipient and message are required.
        if (recipient === "" || message === "") {
            alert("Enter recipient and message");
            return;
        }


        // Create normal text message.
        const data = {

            from: sender,

            to: recipient,

            // IMPORTANT:
            // This is a normal typed message.
            type: "message",

            data: message
        };


        // Send JSON to FastAPI server.
        socket.send(JSON.stringify(data));


        // Show sent message on our own screen.
        messages.innerHTML +=
            "<p>You → " +
            recipient +
            ": " +
            message +
            "</p>";


        // Clear input fields after sending.
        recipientInput.value = "";
        messageInput.value = "";
    };


    // =========================================================
    // 8. SPEECH RECOGNITION SETUP
    // =========================================================
    //
    // Chrome provides Speech Recognition through:
    //
    // window.SpeechRecognition
    // OR
    // window.webkitSpeechRecognition
    //

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    // Check whether browser supports Speech Recognition.
    if (SpeechRecognition) {


        // Create Speech Recognition object.
        const recognition =
            new SpeechRecognition();


        // Recognition language.
        recognition.lang = "en-US";


        // Stop after one spoken sentence.
        recognition.continuous = false;


        // Only return final result.
        recognition.interimResults = false;


        // Prevent recognition.start() from being called
        // multiple times while already listening.
        let isListening = false;


        // =====================================================
        // 9. SPEAK BUTTON
        // =====================================================

        voiceButton.onclick = () => {

            // Do nothing if already listening.
            if (isListening) {
                return;
            }


            // Make sure WebSocket is connected.
            if (!socket) {
                alert("Connect first");
                return;
            }


            // Make sure recipient exists.
            if (recipientInput.value.trim() === "") {
                alert("Enter recipient first");
                return;
            }


            // Start listening state.
            isListening = true;


            // Update button UI.
            voiceButton.disabled = true;
            voiceButton.textContent =
                "🎤 Listening...";


            try {

                // Start browser speech recognition.
                recognition.start();

            } catch (error) {

                console.log(
                    "Recognition start error:",
                    error
                );


                // Reset button if recognition fails.
                isListening = false;

                voiceButton.disabled = false;

                voiceButton.textContent =
                    "🎤 Speak";
            }
        };



// =========================================================
// 10. SPEECH RECOGNITION RESULT
// =========================================================
//
// IMPORTANT:
// Speech Recognition ek sentence ko multiple results mein
// divide kar sakti hai.
//
// Example:
// "I"
// "I am"
// "I am audible"
//
// Isliye hum yahan message SEND nahi karenge.
// Sirf final recognized text collect karenge.
//

let finalTranscript = "";


recognition.onresult = (event) => {

    // Reset transcript for this speaking session.
    finalTranscript = "";


    // Collect all results returned during this session.
    for (let i = 0; i < event.results.length; i++) {

        finalTranscript +=
            event.results[i][0].transcript;
    }


    // Remove unnecessary spaces.
    finalTranscript =
        finalTranscript.trim();


    // Show what Chrome currently understands.
    transcript.textContent =
        "You said: " + finalTranscript;


    console.log(
        "🎤 Current recognition:",
        finalTranscript
    );
};


// =========================================================
// 11. SPEECH RECOGNITION ERROR
// =========================================================

recognition.onerror = (event) => {

    console.log(
        "Speech recognition error:",
        event.error
    );
};


// =========================================================
// 12. SPEECH RECOGNITION FINISHED
// =========================================================
//
// IMPORTANT:
// Message is sent ONLY ONCE when recognition finishes.
//
// This prevents:
//
// I
// I am
// I am audible
//
// from being sent as 3 separate voice messages.
//

recognition.onend = () => {

    console.log(
        "🎤 Recognition ended:",
        finalTranscript
    );


    // Make sure we actually received some speech.
    if (finalTranscript !== "") {

        const sender =
            clientIdInput.value.trim();

        const recipient =
            recipientInput.value.trim();


        // Create ONE voice message.
        const data = {

            from: sender,

            to: recipient,

            type: "voice",

            data: finalTranscript
        };


        // Send ONLY ONE message to the server.
        socket.send(
            JSON.stringify(data)
        );


        // Show the final voice message on sender screen.
        messages.innerHTML +=
            "<p>🎤 You → " +
            recipient +
            ": " +
            finalTranscript +
            "</p>";
    }


    // Reset transcript for the next voice session.
    finalTranscript = "";


    // Reset button state.
    isListening = false;

    voiceButton.disabled = false;

    voiceButton.textContent =
        "🎤 Speak";
};

    // End Speech Recognition support block.
    }


</script>

</body>
</html>
