<!DOCTYPE html>
<html>
<head>
    <title>VoiceLink Client</title>
</head>

<body>

<h1>VoiceLink</h1>    

<input id="clientId" type="text" placeholder="Your ID">

<button id="connect">Connect</button>

<hr>

<input id="recipient" type="text" placeholder="Send to">

<input id="message" type="text" placeholder="Message">

<button id="send">Send</button>

<div id="messages"></div>


<script>

    let socket;

    const clientIdInput = document.getElementById("clientId");
    const connectButton = document.getElementById("connect");

    const messageInput = document.getElementById("message");
    const sendButton = document.getElementById("send");

    const messages = document.getElementById("messages");


    connectButton.onclick = () => {

        const clientId = clientIdInput.value.trim();

        if (clientId === "") {
            alert("Enter your ID");
            return;
        }

        socket = new WebSocket(
            "ws://127.0.0.1:8000/ws/" + clientId
        );


        socket.onopen = () => {

            console.log("Connected");

            messages.innerHTML +=
                "<p>Connected as: " + clientId + "</p>";
        };


        socket.onmessage = (event) => {

            messages.innerHTML +=
                "<p>Received: " + event.data + "</p>";
        };


        socket.onclose = () => {

            messages.innerHTML +=
                "<p>Disconnected</p>";
        };
    };


    sendButton.onclick = () => {

    if (!socket) {
        alert("Connect first");
        return;
    }

    const recipient = document
        .getElementById("recipient")
        .value
        .trim();

    const message = messageInput.value.trim();

    const sender = clientIdInput.value.trim();


    if (recipient === "" || message === "") {
        alert("Enter recipient and message");
        return;
    }


    const data = {
        from: sender,
        to: recipient,
        type: "message",
        data: message
    };


    socket.send(JSON.stringify(data));


    messages.innerHTML +=
        "<p>You → " + recipient + ": " + message + "</p>";


    document.getElementById("recipient").value = "";
    messageInput.value = "";
};

</script>


</body>
</html>
