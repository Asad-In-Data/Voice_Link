<!DOCTYPE html>
<html>
<head>
    <title>VoiceLink Client</title>
</head>

<body>

<h1>VoiceLink</h1>    

<input id="clientId" type="text" placeholder="Your ID">

<button id="connect">Connect</button>

<hr>

<input id="recipient" type="text" placeholder="Send to">

<input id="message" type="text" placeholder="Message">

<button id="send">Send</button>

<div id="messages"></div>

<button id="voiceButton">🎤 Speak</button>

<p id="transcript"></p>


<script>

    let socket;

    const clientIdInput = document.getElementById("clientId");
    const connectButton = document.getElementById("connect");

    const messageInput = document.getElementById("message");
    const sendButton = document.getElementById("send");

    const messages = document.getElementById("messages");

    // const voiceButton = document.getElementById("voiceButton");
    // const transcript = document.getElementById("transcript");


    connectButton.onclick = () => {

        const clientId = clientIdInput.value.trim();

        if (clientId === "") {
            alert("Enter your ID");
            return;
        }

        socket = new WebSocket(
            "ws://127.0.0.1:8000/ws/" + clientId
        );


        socket.onopen = () => {

            console.log("Connected");

            messages.innerHTML +=
                "<p>Connected as: " + clientId + "</p>";
        };


        socket.onmessage = (event) => {

            messages.innerHTML +=
                "<p>Received: " + event.data + "</p>";
                if (message.type === "voice") {
                   const speech = new SpeechSynthesisUtterance(message.data);
                   speech.lang = "en-US";

                   window.speechSynthesis.speak(speech);
                }
        };


        socket.onclose = () => {

            messages.innerHTML +=
                "<p>Disconnected</p>";
        };
    };


    sendButton.onclick = () => {

    if (!socket) {
        alert("Connect first");
        return;
    }

    const recipient = document
        .getElementById("recipient")
        .value
        .trim();

    const message = messageInput.value.trim();

    const sender = clientIdInput.value.trim();


    if (recipient === "" || message === "") {
        alert("Enter recipient and message");
        return;
    }


    const data = {
        from: sender,
        to: recipient,
        type: "message",
        data: message
    };


    socket.send(JSON.stringify(data));


    messages.innerHTML +=
        "<p>You → " + recipient + ": " + message + "</p>";


    document.getElementById("recipient").value = "";
    messageInput.value = "";
};

const voiceButton = document.getElementById("voiceButton");
const transcript = document.getElementById("transcript");

const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;


if (SpeechRecognition) {

    const recognition = new SpeechRecognition();

    recognition.lang = "en-US";
    recognition.continuous = false;
    recognition.interimResults = false;

    let isListening = false;


    voiceButton.onclick = () => {

        if (isListening) {
            return;
        }

        isListening = true;

        voiceButton.disabled = true;
        voiceButton.textContent = "🎤 Listening...";

        try {

            recognition.start();

        } catch (error) {

            console.log("Recognition start error:", error);

            isListening = false;
            voiceButton.disabled = false;
            voiceButton.textContent = "🎤 Speak";
        }
    };


    recognition.onresult = (event) => {
    const text = event.results[0][0].transcript;

    transcript.textContent = "You said: " + text;
    messageInput.value = text;

    const data = {
        from: clientIdInput.value,
        to: recipientInput.value,
        type: "voice",
        data: text
    };

    socket.send(JSON.stringify(data));
};


    recognition.onerror = (event) => {

        console.log(
            "Speech recognition error:",
            event.error
        );
    };


    recognition.onend = () => {

        isListening = false;

        voiceButton.disabled = false;
        voiceButton.textContent = "🎤 Speak";
    };

}
else {

    voiceButton.disabled = true;

    voiceButton.textContent =
        "Speech recognition not supported";
}
</script>


</body>
</html>
